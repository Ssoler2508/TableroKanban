services:
  unit-tests:
    build: .
    command: npm test
    volumes:
      - .:/app
      - /app/node_modules

  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/api/system/status > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles:
      - analysis
    depends_on:
      sonarqube:
        condition: service_healthy
    working_dir: /usr/src
    entrypoint: ["/bin/sh", "-c"]
    command: ["sonar-scanner"]
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src
      - sonar_scanner_cache:/opt/sonar-scanner/.sonar/cache

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_scanner_cache: