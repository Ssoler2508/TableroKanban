<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas y Proyectos Académicos</title>
  <style>
    :root {
      --fondo: #f4f6fb;
      --panel: #ffffff;
      --texto: #1f2933;
      --gris: #6b7684;
      --borde: #dfe4ec;
      --primario: #2f6fed;
      --primario-oscuro: #2456bd;
      --peligro: #d64545;
      --aviso: #f0b429;
      --completado: #2f9e6f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 40px;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 15px;
    }

    .cabecera {
      background: var(--primario);
      color: #ffffff;
      padding: 18px 24px;
    }

    .cabecera h1 {
      margin: 0;
      font-size: 22px;
    }

    .cabecera__subtitulo {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.85;
    }

    .contenido {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .campo {
      margin-bottom: 10px;
    }

    .campo label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--gris);
    }

    .campo input,
    .campo textarea,
    .campo select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--borde);
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      background: #ffffff;
      color: var(--texto);
    }

    .campo textarea {
      resize: vertical;
      min-height: 70px;
    }

    .boton {
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: var(--gris);
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    .boton--primario {
      background: var(--primario);
      width: 100%;
    }

    .boton--primario:hover {
      background: var(--primario-oscuro);
    }

    .boton--mini {
      padding: 5px 9px;
      font-size: 12px;
      margin: 0 4px 4px 0;
    }

    .boton--peligro {
      background: var(--peligro);
    }

    .mensajes {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
    }

    .mensajes li {
      padding: 7px 9px;
      border-radius: 4px;
      margin-bottom: 5px;
      font-size: 13px;
      background: #fdeaea;
      color: #97231f;
    }

    .mensajes li.mensajes__ok {
      background: #e6f6ee;
      color: #1c6b49;
    }

    .resumen {
      font-size: 13px;
      color: var(--gris);
      margin-bottom: 12px;
    }

    .tablero {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .columna {
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 12px;
      min-height: 260px;
    }

    .columna h2 {
      margin: 0 0 10px;
      font-size: 15px;
      border-bottom: 2px solid var(--borde);
      padding-bottom: 8px;
    }

    .columna[data-estado="en_proceso"] h2 {
      border-bottom-color: var(--aviso);
    }

    .columna[data-estado="completado"] h2 {
      border-bottom-color: var(--completado);
    }

    .columna__vacia {
      color: var(--gris);
      font-size: 13px;
      font-style: italic;
    }

    .tarjeta {
      border: 1px solid var(--borde);
      border-left: 4px solid var(--primario);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      background: #ffffff;
    }

    .tarjeta--vencida {
      border-left-color: var(--peligro);
      background: #fff6f6;
    }

    .tarjeta__titulo {
      margin: 0 0 4px;
      font-size: 15px;
    }

    .tarjeta__materia {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--primario);
    }

    .tarjeta__descripcion {
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--gris);
    }

    .tarjeta__fecha,
    .tarjeta__cierre {
      margin: 0;
      font-size: 12px;
      color: var(--gris);
    }

    .tarjeta__acciones {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="cabecera">
    <h1>Gestor de Tareas y Proyectos Académicos</h1>
    <p class="cabecera__subtitulo">Tablero Kanban</p>
  </header>

  <main class="contenido">
    <section class="panel">
      <h2>Nueva tarea</h2>
      <form id="formulario-tarea" class="formulario" novalidate>
        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" name="titulo" autocomplete="off">
        </div>
        <div class="campo">
          <label for="materia">Materia</label>
          <input type="text" id="materia" name="materia" autocomplete="off">
        </div>
        <div class="campo">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion"></textarea>
        </div>
        <div class="campo">
          <label for="fechaEntrega">Fecha de entrega</label>
          <input type="date" id="fechaEntrega" name="fechaEntrega">
        </div>
        <button type="submit" class="boton boton--primario">Crear tarea</button>
      </form>
      <ul id="mensajes" class="mensajes"></ul>
    </section>

    <section class="panel">
      <p id="resumen" class="resumen"></p>
      <div class="tablero" id="tablero">
        <section class="columna" data-estado="pendiente">
          <h2>Pendiente</h2>
          <div class="lista" id="lista-pendiente"></div>
        </section>
        <section class="columna" data-estado="en_proceso">
          <h2>En Proceso</h2>
          <div class="lista" id="lista-en-proceso"></div>
        </section>
        <section class="columna" data-estado="completado">
          <h2>Completado</h2>
          <div class="lista" id="lista-completado"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="logic.js"></script>
  <script>
    'use strict';

    var CLAVE_ALMACEN = 'tableroKanban.tareas';

    var formulario = document.getElementById('formulario-tarea');
    var listaMensajes = document.getElementById('mensajes');
    var contenedorResumen = document.getElementById('resumen');
    var listaPendiente = document.getElementById('lista-pendiente');
    var listaEnProceso = document.getElementById('lista-en-proceso');
    var listaCompletado = document.getElementById('lista-completado');

    var tareas = cargarTareas();

    function cargarTareas() {
      var guardado = null;
      try {
        guardado = window.localStorage.getItem(CLAVE_ALMACEN);
      } catch (error) {
      }
      if (!guardado) {
        return [];
      }
      var tareasGuardadas = [];
      try {
        tareasGuardadas = JSON.parse(guardado);
      } catch (error) {
        tareasGuardadas = [];
      }
      return tareasGuardadas;
    }

    function guardarTareas() {
      try {
        window.localStorage.setItem(CLAVE_ALMACEN, JSON.stringify(tareas));
      } catch (error) {
        mostrarMensajes(['No se pudo guardar el progreso en este navegador.'], 'error');
      }
    }

    function formatear(fecha) {
      if (!fecha) {
        return 'Sin fecha';
      }
      var partes = fecha.split('-');
      return partes[2] + '/' + partes[1] + '/' + partes[0];
    }

    function mostrarMensajes(textos, tipo) {
      listaMensajes.innerHTML = '';
      for (var i = 0; i < textos.length; i++) {
        var item = document.createElement('li');
        item.textContent = textos[i];
        if (tipo === 'ok') {
          item.className = 'mensajes__ok';
        }
        listaMensajes.appendChild(item);
      }
    }

    function botonesAccion(tarea) {
      var html = '';
      if (tarea.estado === 'pendiente') {
        html += '<button class="boton boton--mini" data-accion="avanzar" data-id="' + tarea.id + '">Iniciar</button>';
      }
      if (tarea.estado !== 'completado') {
        html += '<button class="boton boton--mini" data-accion="completar" data-id="' + tarea.id + '">Completar</button>';
      }
      if (tarea.estado !== 'pendiente') {
        html += '<button class="boton boton--mini" data-accion="retroceder" data-id="' + tarea.id + '">Retroceder</button>';
      }
      html += '<button class="boton boton--mini boton--peligro" data-accion="eliminar" data-id="' + tarea.id + '">Eliminar</button>';
      return html;
    }

    function construirTarjeta(tarea) {
      var clases = 'tarjeta';
      if (fechaVencida(tarea)) {
        clases += ' tarjeta--vencida';
      }
      var html = '<article class="' + clases + '" data-id="' + tarea.id + '">';
      html += '<h3 class="tarjeta__titulo">' + tarea.titulo + '</h3>';
      html += '<p class="tarjeta__materia">' + tarea.materia + '</p>';
      if (tarea.descripcion) {
        html += '<p class="tarjeta__descripcion">' + tarea.descripcion + '</p>';
      }
      html += '<p class="tarjeta__fecha">Entrega: ' + formatear(tarea.fechaEntrega) + '</p>';
      if (tarea.fechaFinalizacion) {
        html += '<p class="tarjeta__cierre">Completada: ' + tarea.fechaFinalizacion + '</p>';
      }
      html += '<div class="tarjeta__acciones">' + botonesAccion(tarea) + '</div>';
      html += '</article>';
      return html;
    }

    function contenidoColumna(listaTareas, estado) {
      var filtradas = listaTareas.filter(function (tarea) {
        return tarea.estado === estado;
      });
      if (filtradas.length === 0) {
        return '<p class="columna__vacia">No hay tareas en esta columna.</p>';
      }
      var tarjetas = [];
      for (var i = 0; i < filtradas.length; i++) {
        tarjetas.push(construirTarjeta(filtradas[i]));
      }
      return tarjetas.join('');
    }

    function renderizar() {
      var total = 0;
      var ordenadas = ordenarPorEntrega(tareas);

      listaPendiente.innerHTML = contenidoColumna(ordenadas, 'pendiente');
      listaEnProceso.innerHTML = contenidoColumna(ordenadas, 'en_proceso');
      listaCompletado.innerHTML = contenidoColumna(ordenadas, 'completado');

      var datos = resumenTareas(tareas);
      contenedorResumen.textContent = 'Total: ' + datos.total +
        ' | Pendientes: ' + datos.pendientes +
        ' | En proceso: ' + datos.enProceso +
        ' | Completadas: ' + datos.completadas +
        ' | Vencidas: ' + datos.vencidas;
    }

    function crearDesdeFormulario() {
      var datos = {
        titulo: document.getElementById('titulo').value,
        materia: document.getElementById('materia').value,
        descripcion: document.getElementById('descripcion').value,
        fechaEntrega: document.getElementById('fechaEntrega').value
      };
      var resultado = crearTarea(datos, tareas);
      if (!resultado.ok) {
        mostrarMensajes(resultado.errores, 'error');
        return;
      }
      tareas = resultado.tareas;
      guardarTareas();
      formulario.reset();
      renderizar();
      mostrarMensajes(['Tarea creada correctamente.'], 'ok');
    }

    function mover(id, destino) {
      var resultado = moverTarea(tareas, id, destino);
      if (!resultado.ok) {
        mostrarMensajes(resultado.errores, 'error');
        return;
      }
      tareas = resultado.tareas;
      guardarTareas();
      renderizar();
      mostrarMensajes(['Tarea movida a ' + destino.replace('_', ' ') + '.'], 'ok');
    }

    function eliminar(id) {
      var resultado = eliminarTarea(tareas, id);
      if (!resultado.ok) {
        mostrarMensajes(resultado.errores, 'error');
        return;
      }
      tareas = resultado.tareas;
      renderizar();
      mostrarMensajes(['Tarea eliminada.'], 'ok');
    }

    formulario.addEventListener('submit', function (evento) {
      evento.preventDefault();
      crearDesdeFormulario();
    });

    document.getElementById('tablero').addEventListener('click', function (evento) {
      var boton = evento.target.closest('button[data-accion]');
      if (!boton) {
        return;
      }
      var id = boton.getAttribute('data-id');
      var accion = boton.getAttribute('data-accion');
      if (accion === 'avanzar') {
        mover(id, 'en_proceso');
      } else if (accion === 'completar') {
        mover(id, 'completado');
      } else if (accion === 'retroceder') {
        mover(id, 'pendiente');
      } else if (accion === 'eliminar') {
        eliminar(id);
      }
    });

    renderizar();
  </script>
</body>
</html>
